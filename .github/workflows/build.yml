name: Build Husky WiFi Fix Kernel

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -af || true
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git gnupg flex bison build-essential zip jq curl \
            zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-xf86vm-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip bc ccache libssl-dev libelf-dev dwarves dos2unix
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o repo
          chmod +x repo && sudo mv repo /usr/local/bin/repo

      - name: Fix script line endings
        run: find scripts -name '*.sh' -exec dos2unix {} +

      - name: Download kernel source
        run: |
          mkdir -p kernel && cd kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-shusky-6.1-android16 --depth=1
          repo sync -c -j$(nproc) --no-tags
          df -h

      - name: Install KernelSU and fix GKI exports
        working-directory: kernel/aosp
        run: |
          curl -LSs "https://github.com/tiann/KernelSU/raw/main/kernel/setup.sh" | bash -
          # Required: remove protected exports or WiFi/BT modules won't load and boot may hang
          sed -i '/protected_exports_list.*abi_gki_protected_exports_aarch64/d' BUILD.bazel 2>/dev/null || true
          rm -f android/abi_gki_protected_exports_*
          git add -A
          git commit -m "KernelSU + remove protected exports for custom GKI" || true

      - name: Apply WiFi/BT recovery patches
        run: |
          export KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          chmod +x scripts/*.sh
          ./scripts/apply-patches.sh || echo "Patch apply had warnings — continuing build"

      - name: Build kernel
        working-directory: kernel
        run: |
          bash private/devices/google/shusky/build_shusky.sh \
            --config=pixel_debug_common \
            --kernel_package=@//aosp \
            --lto=thin
          echo "=== Built images ==="
          ls -lh out/shusky/dist/*.img

      - name: Package images and AnyKernel3 ZIP
        run: |
          mkdir -p out/images out/flashable
          DIST="kernel/out/shusky/dist"
          for img in boot vendor_kernel_boot dtbo vendor_dlkm system_dlkm; do
            if [[ -f "$DIST/${img}.img" ]]; then
              cp "$DIST/${img}.img" out/images/
            else
              echo "WARNING: missing $DIST/${img}.img"
            fi
          done
          chmod +x scripts/*.sh
          dos2unix scripts/*.sh anykernel3/anykernel.sh 2>/dev/null || true
          ./scripts/package-flashable.sh "husky-wifi-fix-${GITHUB_RUN_NUMBER}"

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Husky WiFi Fix Kernel #${{ github.run_number }}
          body: |
            Pixel 8 Pro (husky) WiFi/BT recovery kernel with KernelSU.

            **IMPORTANT — flash ALL partitions (fastboot + fastbootd):**
            ```
            fastboot flash boot boot.img
            fastboot flash vendor_kernel_boot vendor_kernel_boot.img
            fastboot flash dtbo dtbo.img
            fastboot reboot fastboot
            fastboot flash vendor_dlkm vendor_dlkm.img
            fastboot flash system_dlkm system_dlkm.img
            fastboot reboot
            ```

            Or flash the `.zip` from Lineage Recovery.

            `fastboot boot boot.img` alone will NOT work on Pixel 8 Pro.
          files: |
            out/images/boot.img
            out/images/vendor_kernel_boot.img
            out/images/dtbo.img
            out/images/vendor_dlkm.img
            out/images/system_dlkm.img
            out/flashable/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
