name: Build Husky WiFi Fix Kernel

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Clean build (expunge bazel cache)'
        type: boolean
        default: false

env:
  KERNEL_DIR: ${{ github.workspace }}/kernel

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python3-pip bc bison flex \
            libssl-dev libelf-dev dwarves ccache \
            zip unzip openjdk-17-jdk
          mkdir -p ~/bin
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup kernel source + patches + KernelSU
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup.sh
        env:
          CCACHE_DIR: /tmp/ccache

      - name: Build kernel
        run: |
          export CLEAN=${{ github.event.inputs.clean_build && '1' || '0' }}
          ./scripts/build.sh
        env:
          CCACHE_DIR: /tmp/ccache

      - name: Upload flashable kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: husky-wifi-fix-kernel
          path: |
            out/flashable/*.zip
            out/flashable/*.sha256
            out/images/*.img
          retention-days: 30

      - name: Build summary
        run: |
          echo "## Husky WiFi Fix Kernel Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** $(ls out/flashable/*.zip | head -1 | xargs basename)" >> $GITHUB_STEP_SUMMARY
          echo "- **KernelSU:** integrated" >> $GITHUB_STEP_SUMMARY
          echo "- **Device:** Pixel 8 Pro (husky)" >> $GITHUB_STEP_SUMMARY
          echo "- **Android:** 16 (LineageOS compatible)" >> $GITHUB_STEP_SUMMARY
          if strings out/images/boot.img 2>/dev/null | grep -qi kernelsu; then
            echo "- **KernelSU verify:** PASS" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **KernelSU verify:** CHECK MANUALLY" >> $GITHUB_STEP_SUMMARY
          fi
