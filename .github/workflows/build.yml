name: Build Husky WiFi Fix Kernel

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -af || true
          echo "Disk after cleanup:"
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git gnupg flex bison build-essential zip jq curl \
            zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip bc ccache libssl-dev libelf-dev dwarves
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o repo
          chmod +x repo
          sudo mv repo /usr/local/bin/repo

      - name: Fix script line endings
        run: |
          sudo apt-get install -y dos2unix
          find scripts -name '*.sh' -exec dos2unix {} +

      - name: Download kernel source
        run: |
          mkdir -p kernel && cd kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-shusky-6.1-android16 --depth=1
          repo sync -c -j$(nproc) --no-tags
          df -h

      - name: Install KernelSU
        working-directory: kernel/common
        run: |
          curl -LSs "https://github.com/tiann/KernelSU/raw/main/kernel/setup.sh" | bash -
          git add -A
          git commit -m "Integrate KernelSU" || true

      - name: Apply WiFi/BT recovery patches
        run: |
          export KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          chmod +x scripts/*.sh
          ./scripts/apply-patches.sh

      - name: Build kernel
        working-directory: kernel
        run: |
          echo "Building shusky kernel for Pixel 8 Pro (husky)..."
          bash private/devices/google/shusky/build_shusky.sh \
            --config=pixel_debug_common \
            --lto=thin
          ls -lh out/shusky/dist/*.img

      - name: Package flashable ZIP
        run: |
          mkdir -p out/images out/flashable
          cp kernel/out/shusky/dist/boot.img out/images/
          cp kernel/out/shusky/dist/vendor_kernel_boot.img out/images/ 2>/dev/null || true
          cp kernel/out/shusky/dist/dtbo.img out/images/ 2>/dev/null || true
          chmod +x scripts/*.sh
          ./scripts/package-flashable.sh "husky-wifi-fix-${GITHUB_RUN_NUMBER}"

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Husky WiFi Fix Kernel #${{ github.run_number }}
          body: |
            Pixel 8 Pro (husky) WiFi/BT recovery kernel with KernelSU.
            Android 16 / LineageOS compatible.

            **Flash (test first):**
            ```
            fastboot boot boot.img
            ```

            **Permanent flash:**
            ```
            fastboot flash boot boot.img
            fastboot flash vendor_kernel_boot vendor_kernel_boot.img
            fastboot flash dtbo dtbo.img
            ```
          files: |
            out/images/boot.img
            out/images/vendor_kernel_boot.img
            out/images/dtbo.img
            out/flashable/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        run: |
          echo "## Husky WiFi Fix Kernel Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Device: Pixel 8 Pro (husky)" >> $GITHUB_STEP_SUMMARY
          echo "- Run: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- KernelSU: integrated" >> $GITHUB_STEP_SUMMARY
          if strings out/images/boot.img 2>/dev/null | grep -qi kernelsu; then
            echo "- KernelSU verify: PASS" >> $GITHUB_STEP_SUMMARY
          fi
